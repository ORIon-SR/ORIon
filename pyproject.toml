[project]
name = "orion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Liam-Binedell", email = "liam.binedell@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "wandb>=0.30.0",
]

[project.scripts]
orion = "orion:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
